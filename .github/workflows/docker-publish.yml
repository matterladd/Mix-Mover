name: Push new Docker image

on:
  workflow_dispatch:
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  # IMAGE_NAME: ${{ github.repository }}
  IMAGE_NAME: matterladd/mix-mover

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        # GITHUB_TOKEN is a secret that is automatically
        # created for every workflow run.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push
        # pushes to every tag
        run: |
          docker buildx build \
            --tag ghcr.io/${{ env.IMAGE_NAME }}:latest \
            --tag ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --push \
            .
